<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: pointer; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000;
    transition: opacity .45s ease, filter .45s ease; }
  #waiting { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; opacity: 0; transition: opacity .35s ease;
    color: #e8ecf0; font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
  body.waiting #waiting { opacity: 1; }
  body.waiting #video { opacity: .28; filter: blur(8px) brightness(.6); }
  #bar { width: 168px; height: 2px; overflow: hidden; background: rgba(255,255,255,.12); }
  #bar i { display: block; height: 100%; width: 40%; background: #ff7a1a;
    animation: slide 1.2s ease-in-out infinite; }
  #label { letter-spacing: .34em; opacity: .75; }
  #hint { font-size: 11px; letter-spacing: .22em; opacity: .45; }
  @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
</style>
</head>
<body>
<video id="video" src="/boot-video.mp4" autoplay playsinline preload="auto"></video>
<div id="waiting">
  <div id="label">正在加载 DSH</div>
  <div id="bar"><i></i></div>
  <div id="hint">Esc 或点击跳过动画</div>
</div>
<script>
  (function () {
    // The DSH boot animation plugin lives in the MAIN window, whose sessionStorage
    // is separate from this splash window's; localStorage IS shared per origin, so
    // the launch record goes there and the plugin consumes it once.
    try { localStorage.setItem('dsh-boot-animation:desktop-splash', String(Date.now())) } catch (error) {}
    try { sessionStorage.setItem('dsh-boot-animation:boot', String(Date.now())) } catch (error) {}
    var video = document.getElementById('video');
    var settled = false;
    var waitingShown = false;
    function showWaiting() {
      if (waitingShown) return;
      waitingShown = true;
      document.body.classList.add('waiting');
    }
    function signal(kind) {
      if (settled) return;
      settled = true;
      showWaiting();
      try {
        var api = window.__DSH_BOOT_SPLASH__;
        if (!api) return;
        if (kind === 'skip' && typeof api.skip === 'function') api.skip();
        else if (typeof api.done === 'function') api.done();
      } catch (error) {}
    }
    // The clip owns the launch: the desktop waits for this signal before it
    // swaps the workspace in, so the video is never cut short and the host
    // finishes booting behind it.
    video.addEventListener('ended', function () { signal('done') });
    video.addEventListener('error', function () { signal('done') });
    document.addEventListener('pointerdown', function () { signal('skip') });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' || event.key === ' ' || event.key === 'Enter') signal('skip');
    });
    try {
      var attempt = video.play();
      if (attempt && typeof attempt.catch === 'function') {
        attempt.catch(function () {
          // Some hosts refuse unmuted autoplay; the clip still has to show.
          video.muted = true;
          video.play().catch(function () { signal('done') });
        });
      }
    } catch (error) {
      signal('done');
    }
    // Never let a broken video hold the launch: after 20s let the desktop go on
    // (the main process safety timer is the final backstop).
    setTimeout(function () { signal('done') }, 20000);
  })();
</script>
</body>
</html>
